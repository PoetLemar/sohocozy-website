name: sohocozy
region: nyc
static_sites:
  - name: site
    git:
      repo_clone_url: https://github.com/PoetLemar/sohocozy-website.git
      branch: main
    source_dir: /
    environment_slug: html
    build_command: mkdir -p dist && cp index.html elements.js dist/ && cp -R assets dist/
    output_dir: dist
    index_document: index.html
domains:
  - domain: sohocozystore.com
    type: PRIMARY
  - domain: www.sohocozystore.com
    type: ALIAS
